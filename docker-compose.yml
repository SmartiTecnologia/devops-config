version: "3.9"

services:

  ################################
  # JENKINS
  ################################
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    restart: always
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
    networks:
      - devops

  ################################
  # SENTRY DEPENDENCIES
  ################################
  sentry-postgres:
    image: postgres:14
    container_name: sentry-postgres
    restart: always
    environment:
      POSTGRES_DB: sentry
      POSTGRES_USER: sentry
      POSTGRES_PASSWORD: sentry
    volumes:
      - sentry_postgres:/var/lib/postgresql/data
    networks:
      - devops

  sentry-redis:
    image: redis:7
    container_name: sentry-redis
    restart: always
    networks:
      - devops

  ################################
  # SENTRY
  ################################
  sentry:
    image: getsentry/sentry:24.1.0
    container_name: sentry
    restart: always
    env_file:
      - ./sentry/.env
    depends_on:
      - sentry-postgres
      - sentry-redis
    ports:
      - "9000:9000"
    volumes:
      - sentry_data:/var/lib/sentry/files
    networks:
      - devops

  sentry-worker:
    image: getsentry/sentry:24.1.0
    command: run worker
    env_file:
      - ./sentry/.env
    depends_on:
      - sentry
    networks:
      - devops

  sentry-cron:
    image: getsentry/sentry:24.1.0
    command: run cron
    env_file:
      - ./sentry/.env
    depends_on:
      - sentry
    networks:
      - devops

  ################################
  # PROMETHEUS
  ################################
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - devops

  ################################
  # GRAFANA
  ################################
  grafana:
    image: grafana/grafana
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - devops

  ################################
  # OPENTELEMETRY COLLECTOR
  ################################
  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: otel-collector
    command: ["--config=/etc/otel-collector.yml"]
    volumes:
      - ./otel/otel-collector.yml:/etc/otel-collector.yml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    networks:
      - devops

networks:
  devops:

volumes:
  jenkins_data:
  sentry_postgres:
  sentry_data:
  prometheus_data:
  grafana_data: