version: '3.9'

services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"   # Porta de acesso ao Jenkins
      - "50000:50000" # Porta usada para comunicação com agentes
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock  # Permite que Jenkins use Docker dentro do host

volumes:
  jenkins_home:
